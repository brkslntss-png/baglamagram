<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>baglamagram</title>
  <style>
    :root { color-scheme: dark light; --bg: #0a0a0b; --kart: #141416; --metin: #f3efe7; --metin-2: #b9b3a9; --altin: #d2ac63; --cizgi: rgba(210, 172, 99, 0.35); }
    @media (prefers-color-scheme: light) { :root { --bg: #f2f2f7; --kart: #ffffff; --metin: #1c1c1e; --metin-2: #6b6b70; --altin: #9c7a3c; --cizgi: rgba(156, 122, 60, 0.35); } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--metin); font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
    main { width: min(440px, 100%); text-align: center; padding: 40px 32px 34px; border: 1px solid var(--cizgi); border-radius: 28px; background: var(--kart); }
    img { width: 96px; height: 96px; display: block; margin: 0 auto 22px; }
    h1 { font: 600 26px/1.2 'Playfair Display', Georgia, 'Times New Roman', serif; margin: 0 0 10px; }
    p { margin: 0 0 26px; color: var(--metin-2); }
    button { font: inherit; font-weight: 600; height: 46px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--altin); color: #15110a; cursor: pointer; }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.6; cursor: default; }
    small { display: block; margin-top: 18px; color: var(--metin-2); font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <img src="simge.png" alt="" />
    <h1 data-m="baslik">İnternet bağlantısı yok</h1>
    <p data-m="metin">baglamagram’ı kullanmak için internete bağlı olman gerekiyor. Bağlantı gelince portal kendiliğinden açılır.</p>
    <button type="button" data-m="dugme">Tekrar dene</button>
    <small data-m="not">Bağlıysan site kısa süreliğine ulaşılamıyor olabilir; birazdan yeniden dene.</small>
  </main>
  <script src="cevrimdisi.js"></script>
</body>
</html>
